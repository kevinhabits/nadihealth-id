name: Publish Art World Weekly full-content feed

on:
  push:
    branches: [main]
    paths:
      - "art-world-daily/generate_feed.py"
      - ".github/workflows/art-world-daily.yml"
  schedule:
    # 08:05 Asia/Taipei every Friday (UTC+8 year-round).
    - cron: "5 0 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: art-world-weekly-full-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate full-content weekly feed
        run: python art-world-daily/generate_feed.py

      - name: Validate RSS XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("art-world-daily/feed.xml")
          root = ET.parse(path).getroot()
          assert root.tag == "rss"
          item = root.find("./channel/item")
          assert item is not None
          description = item.findtext("description") or ""
          assert len(description) > 10_000, "Full issue was not embedded"
          print(f"Validated {path} with {len(description):,} embedded characters")
          PY

      - name: Commit updated feed
        run: |
          if [ -z "$(git status --porcelain -- art-world-daily/feed.xml)" ]; then
            echo "Feed is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art-world-daily/feed.xml
          git commit -m "Update Art World Weekly full-content feed"
          git push
